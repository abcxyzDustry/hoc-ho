<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>hocho — Tải ứng dụng</title>
<link rel="canonical" href="/index.html#download">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{--green:#16a34a;--lime:#4d7c0f;--bg:#f8fafc;--card:#fff;--border:rgba(15,23,42,.09);--cream:#0f172a;--muted:rgba(15,23,42,.5);--font:'Plus Jakarta Sans',sans-serif}
body{font-family:var(--font);background:var(--bg);color:var(--cream);min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:24px}
body::before{content:'';position:fixed;inset:0;background:radial-gradient(ellipse 70% 50% at 0% 0%,rgba(21,128,61,.06) 0%,transparent 60%);pointer-events:none}
.wrap{max-width:440px;width:100%;text-align:center;position:relative;z-index:1}
.logo{display:inline-flex;align-items:center;gap:10px;text-decoration:none;margin-bottom:32px}
.logo-mark{width:44px;height:44px;background:linear-gradient(135deg,var(--green),var(--lime));border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:1rem;font-weight:900;color:#fff;font-family:monospace}
.logo-name{font-weight:800;font-size:1.4rem;color:var(--cream)}
h1{font-size:1.6rem;font-weight:800;color:var(--cream);margin-bottom:10px;letter-spacing:-.03em}
.sub{font-size:.9rem;color:var(--muted);font-weight:500;line-height:1.6;margin-bottom:32px}
.btn-chplay{display:inline-block;margin-bottom:12px}
.btn-chplay img{height:60px;border-radius:8px;box-shadow:0 4px 16px rgba(15,23,42,.1);transition:.2s}
.btn-chplay:hover img{transform:translateY(-2px);box-shadow:0 8px 24px rgba(15,23,42,.15)}
.note{font-size:.78rem;color:var(--muted);font-weight:600;margin:16px 0 28px}
.divider{width:100%;border:none;border-top:1px solid var(--border);margin-bottom:24px}
.back-link{display:inline-flex;align-items:center;gap:6px;color:var(--muted);text-decoration:none;font-size:.84rem;font-weight:700;padding:10px 18px;border:1px solid var(--border);border-radius:50px;background:var(--card);transition:.2s}
.back-link:hover{border-color:rgba(22,163,74,.4);color:var(--green)}
</style>
</head>
<body>
<div class="wrap">
  <a href="index.html" class="logo">
    <div class="logo-mark">HC</div>
    <span class="logo-name">hocho</span>
  </a>
  <h1>Tải ứng dụng hocho</h1>
  <p class="sub">Đặt hỗ trợ khi ốm đau chỉ trong 30 giây.<br>Có mặt trên Google Play — cài ngay hôm nay.</p>

  <a href="https://play.google.com/store/apps/details?id=com.hocho.customer" class="btn-chplay" target="_blank" rel="noopener">
    <img src="https://play.google.com/intl/en_us/badges/static/images/badges/vi_badge_web_generic.png" alt="Tải trên Google Play">
  </a>
  <div class="note">Ứng dụng dành cho sinh viên cần hỗ trợ khi ốm đau</div>

  <hr class="divider">

  <a href="register.html" class="btn-chplay" target="_blank" rel="noopener">
    <img src="https://play.google.com/intl/en_us/badges/static/images/badges/vi_badge_web_generic.png" alt="Tải trên Google Play - App Đối tác">
  </a>
  <div class="note">Ứng dụng dành cho Đối tác nhận đơn và quản lý thu nhập</div>

  <a href="index.html" class="back-link">← Về trang chủ</a>
</div>
</body>
</html>
